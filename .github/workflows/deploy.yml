name: Objavi stranicu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: u
        run: |
          z=$(ls *.zip | head -1)
          mkdir site && unzip -q "$z" -d site
          d=$(dirname "$(find site -name index.html | head -1)")
          echo "dir=$d" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.u.outputs.dir }}
      - id: d
        uses: actions/deploy-pages@v4
